[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raphael"
version = "0.3.6"
description = "A JARVIS-style, always-listening desktop AI assistant"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "RAPHAEL Contributors" },
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "openwakeword>=0.4.0",
    "onnxruntime>=1.15.0",
    "faster-whisper>=1.0.0",
    "piper-tts[alignment]>=1.8.0",
    "pysilero-vad>=2.1,<3",
    "httpx>=0.24.0",
    "ddgs>=9.5,<10",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12>=12,<13; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
]
train = ["onnx>=1.15.0", "scikit-learn>=1.3.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
raphael = "raphael.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/raphael"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q -m 'not integration'"
markers = ["integration: requires real audio devices, downloaded models, or training dependencies"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []
