[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ciel"
version = "0.3.6"
description = "A personal desktop voice assistant"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "CIEL Contributors" },
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "packaging>=23.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "httpx>=0.24.0",
    "ddgs>=9.5,<10",
]

[project.optional-dependencies]
voice = [
    "onnxruntime>=1.15.0",
    "faster-whisper>=1.0.0",
    "piper-tts[alignment]>=1.8.0",
    "pysilero-vad>=2.1,<3",
]
wake = ["openwakeword>=0.4.0"]
pocket-tts = ["pocket-tts==3.3.0"]
pocket-int8 = ["pocket-tts[quantize]==3.3.0"]
benchmark = ["psutil>=5.9,<8"]
voice-bank = [
    "pocket-tts==3.3.0",
    "psutil>=5.9,<8",
    "yt-dlp>=2026.8.19,<2027",
]
gpu = [
    "nvidia-cublas-cu12>=12,<13; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
]
train = ["openwakeword>=0.4.0", "onnx>=1.15.0", "scikit-learn>=1.3.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "psutil>=5.9,<8",
    "onnxruntime>=1.15.0",
    "faster-whisper>=1.0.0",
    "piper-tts[alignment]>=1.8.0",
    "pysilero-vad>=2.1,<3",
    "openwakeword>=0.4.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
ciel = "ciel.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ciel"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q -m 'not integration'"
markers = ["integration: requires real audio devices, downloaded models, or training dependencies"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []
