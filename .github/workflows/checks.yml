name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
          python -m pip install -e ".[dev]"
      - name: Lint and test
        run: |
          ruff check src tests scripts
          pytest
          python -m pip check
          for script in setup.sh scripts/*.sh; do
            bash -n "$script" || exit
          done
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/ciel-*.whl
      - name: Smoke test installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m ciel --help
          ciel --version
          python - <<'PY'
          import subprocess
          import sys
          from importlib.resources import files
          from ciel.paths import bundled_worker_path, development_root, voice_profile_path

          assert development_root() is None
          assert files("ciel").joinpath("web_assets/index.html").is_file()
          assert bundled_worker_path().is_file()
          assert voice_profile_path("ciel").is_file()
          subprocess.run(
              [sys.executable, "-I", "-S", str(bundled_worker_path()), "--help"],
              check=True,
          )
          PY
