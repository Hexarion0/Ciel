<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ciel</title>
  <style>
    :root {
      --outside: #05080f;
      --background: #090e1a;
      --surface: #131b2c;
      --surface-hover: #1a2438;
      --border: #2c3850;
      --border-soft: #1e293e;
      --text: #eef2ff;
      --muted: #a6b2c9;
      --quiet: #8392ac;
      --purple: #8b5cf6;
      --purple-hover: #a480fa;
      --cyan: #67e8f9;
      --error: #ffb4ac;
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--outside);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, textarea { font: inherit; }
    button { cursor: pointer; color: inherit; transition: background 120ms, border-color 120ms; }
    button:disabled { opacity: .4; cursor: default; }
    :focus-visible { outline: 2px solid var(--purple-hover); outline-offset: 4px; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .app {
      width: min(1180px, calc(100% - 40px)); height: calc(100dvh - 40px); margin: 20px auto;
      background: var(--background); border: 1px solid var(--border-soft); border-radius: 14px;
      display: flex; flex-direction: column;
    }
    .topbar { padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 29px; height: 29px; color: var(--purple-hover); }
    .brand-name { font-size: 14px; font-weight: 600; letter-spacing: 1.6px; }
    .brand-subtitle { font-size: 11px; color: var(--quiet); margin-top: 2px; }
    .session-meta { display: flex; align-items: center; gap: 18px; }
    .owner-label { color: var(--muted); font-size: 12px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .connection { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); border: 1px solid var(--border-soft); padding: 6px 10px; border-radius: 6px; }
    .connection:before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); }
    .offline .connection:before { background: var(--quiet); }
    .stage { flex: 1; min-height: 0; display: flex; align-items: center; flex-direction: column; padding: 0 28px 12px; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .speech-slot { --source-space: 0px; height: calc(128px + var(--source-space)); flex-shrink: 0; width: 100%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; }
    .speech-slot.has-sources { --source-space: 34px; }
    .presence { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; padding-bottom: 6px; }
    .orb {
      --size: clamp(230px, 36dvh, 330px);
      width: var(--size); height: var(--size); border: 0; padding: 0; flex-shrink: 0;
      background: none; border-radius: 50%; position: relative;
    }
    .orb canvas { display: block; width: 100%; height: 100%; border-radius: 50%; pointer-events: none; }
    .orb:focus-visible { outline-offset: -9px; }
    .orb:hover:not(:disabled) .orb-action { color: var(--text); background: var(--surface-hover); border-color: var(--border); }
    .orb.no-canvas:before { content: ""; position: absolute; inset: 15%; border-radius: 50%; border: 1px solid var(--cyan); background: var(--surface); }
    .orb:disabled { opacity: .6; }
    .orb-action { position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 5px; padding: 4px 8px; border: 1px solid transparent; border-radius: 5px; color: var(--quiet); font-size: 10px; white-space: nowrap; }
    .orb-action svg { width: 12px; height: 12px; }
    .state-title { font-size: 23px; font-weight: 500; letter-spacing: -.55px; margin: 12px 0 5px; text-align: center; }
    .state-hint { margin: 0; color: var(--muted); font-size: 12px; text-align: center; max-width: 430px; }
    .speech { position: relative; flex-shrink: 0; display: flex; flex-direction: column; max-height: calc(116px + var(--source-space)); width: fit-content; max-width: min(100%, 680px); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px 13px; }
    .speech:before { content: ""; position: absolute; bottom: -6px; left: calc(50% - 6px); width: 10px; height: 10px; background: var(--surface); border-top: 1px solid var(--border); border-left: 1px solid var(--border); transform: rotate(225deg); }
    .speech-heading { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 5px; color: var(--cyan); font-size: 10px; }
    .dismiss { width: 28px; height: 24px; margin: -2px -6px -2px 0; border: 0; border-radius: 4px; background: none; color: var(--muted); display: grid; place-items: center; }
    .dismiss:hover { background: var(--surface-hover); color: var(--text); }
    .dismiss svg { width: 14px; height: 14px; }
    .speech-text { min-height: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; max-height: 65px; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .speech.live .speech-text:after { content: ""; display: inline-block; width: 4px; height: 11px; margin-left: 5px; background: var(--cyan); }
    .speech-note { flex-shrink: 0; color: var(--muted); font-size: 11px; margin-top: 6px; }
    .speech-note:empty { display: none; }
    .speech-sources { flex-shrink: 0; display: flex; gap: 12px; max-width: 100%; margin-top: 5px; padding: 4px 2px; overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .speech-sources a { flex-shrink: 0; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--cyan); font-size: 11px; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .speech-sources a:hover { color: var(--text); }
    .speech-sources a:focus-visible { outline-offset: -2px; }
    .dock { flex-shrink: 0; width: min(100%, 950px); align-self: center; padding: 0 28px 22px; }
    .feedback { min-height: 26px; max-height: 72px; overflow: auto; white-space: pre-line; overflow-wrap: anywhere; padding: 0 2px 9px; font-size: 12px; color: var(--muted); }
    .feedback.error { color: var(--error); }
    .composer { display: flex; align-items: center; gap: 14px; padding: 13px 14px 13px 17px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
    .composer:focus-within { border-color: var(--purple-hover); }
    .input-stack { flex: 1; min-width: 0; }
    .input-label { display: block; color: var(--muted); font: 11px/1.5 ui-monospace, monospace; margin-bottom: 4px; overflow-wrap: anywhere; }
    textarea { display: block; width: 100%; min-height: 24px; max-height: 100px; line-height: 1.5; resize: none; border: 0; outline: none; padding: 0; background: transparent; color: var(--text); }
    textarea::placeholder { color: var(--quiet); }
    .send { width: 44px; height: 44px; display: grid; place-items: center; background: var(--purple); color: var(--text); border: 0; border-radius: 7px; flex-shrink: 0; }
    .send:hover:not(:disabled) { background: var(--purple-hover); }
    .send[aria-busy="true"] svg { opacity: .45; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
    .controls, .secondary-controls { display: flex; align-items: center; gap: 6px; }
    .control { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 12px; font-size: 12px; border: 1px solid var(--border-soft); border-radius: 7px; background: none; color: var(--muted); min-height: 42px; }
    .control:hover:not(:disabled) { color: var(--text); border-color: var(--border); background: var(--surface); }
    .control[aria-pressed="true"] { color: var(--text); border-color: var(--purple); }
    .control svg { width: 15px; height: 15px; }
    .control.secondary { border-color: transparent; padding-left: 10px; padding-right: 10px; }
    .keyboard-hint { font-size: 10px; color: var(--quiet); text-align: center; margin-top: 12px; }
    @media (max-width: 600px) {
      .app { width: 100%; height: 100dvh; margin: 0; border: 0; border-radius: 0; }
      .topbar { padding: 18px; }
      .brand-subtitle { display: none; }
      .session-meta { gap: 10px; }
      .owner-label { display: none; }
      .stage { padding: 0 18px 12px; }
      .speech-slot { height: calc(144px + var(--source-space)); }
      .orb { --size: clamp(210px, 34dvh, 290px); }
      .dock { padding: 0 18px 18px; }
      .speech { padding: 8px 13px 11px; max-height: calc(132px + var(--source-space)); }
      .speech-heading { min-height: 34px; }
      .dismiss { width: 36px; height: 36px; }
      .speech-text { font-size: 13px; max-height: 66px; }
      .composer { padding-left: 12px; gap: 10px; }
      .control { min-height: 44px; padding: 10px; font-size: 11px; }
      .control.secondary { padding-left: 7px; padding-right: 7px; }
      .toolbar { gap: 8px; }
      .secondary-controls { gap: 0; }
      .state-title { font-size: 21px; }
      .keyboard-hint { display: none; }
    }
    @media (max-width: 360px) {
      .control { padding: 10px 8px; gap: 5px; }
      .control.secondary svg { display: none; }
    }
    @media (max-height: 650px) {
      .app { height: 100dvh; margin-top: 0; margin-bottom: 0; border-radius: 0; }
      .topbar { padding-top: 10px; padding-bottom: 10px; }
      .brand-subtitle { display: none; }
      .stage { padding-bottom: 6px; }
      .speech-slot { height: calc(110px + var(--source-space)); padding-bottom: 8px; }
      .speech { padding-top: 5px; padding-bottom: 8px; max-height: calc(102px + var(--source-space)); }
      .speech-heading { margin-bottom: 1px; min-height: 0; }
      .speech-text { max-height: 32px; font-size: 12px; }
      .orb { --size: 64px; }
      .orb-action { display: none; }
      .state-title { font-size: 16px; margin-top: 3px; margin-bottom: 2px; }
      .state-hint { display: none; }
      .presence { padding-bottom: 0; }
      .dock { padding-bottom: 10px; }
      .composer { padding-top: 9px; padding-bottom: 9px; }
      .keyboard-hint { display: none; }
      .feedback { max-height: 40px; min-height: 22px; padding-bottom: 5px; }
    }
    @media (max-height: 650px) and (max-width: 450px) {
      .state-hint { display: none; }
      .speech-slot { height: calc(110px + var(--source-space)); }
      .speech-text { max-height: 30px; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body class="offline">
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11"/><path d="M10 19V9h5a3 3 0 0 1 0 6h-5m5 0 4 4"/></svg>
      <div><div class="brand-name">CIEL</div><div class="brand-subtitle">On your computer</div></div>
    </div>
    <div class="session-meta"><span class="owner-label" id="owner-label"></span><div class="connection" id="connection" role="status">Connecting</div></div>
  </header>
  <main class="stage" aria-label="Ciel voice assistant">
    <div class="speech-slot" id="speech-slot">
      <div class="speech" id="speech" hidden>
        <div class="speech-heading"><span>Ciel</span><button class="dismiss" id="dismiss-speech" type="button" aria-label="Dismiss reply"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10m0-10L7 17"/></svg></button></div>
        <div class="speech-text" id="speech-text" tabindex="0" aria-label="Ciel's current reply" aria-live="off"></div>
        <div class="speech-note" id="speech-note"></div>
        <nav class="speech-sources" id="speech-sources" aria-label="Sources for Ciel's reply" hidden></nav>
      </div>
    </div>
    <div class="sr-only" id="reply-announcement" role="status" aria-live="polite" aria-atomic="true"></div>
    <div class="presence">
      <button class="orb" id="core" type="button" aria-label="Mute microphone" aria-pressed="false" aria-describedby="state-hint" disabled>
        <canvas id="orb-canvas" width="400" height="400" aria-hidden="true"></canvas>
        <span class="orb-action" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3"/></svg><span id="orb-action">Mute mic</span></span>
      </button>
      <h1 class="state-title" id="core-state">Connecting to Ciel.</h1>
      <p class="state-hint" id="state-hint">Waiting for the assistant on this computer.</p>
    </div>

  </main>
  <div class="dock">
    <div class="feedback" id="notice" role="status">Connecting…</div>
    <form class="composer" id="composer">
      <div class="input-stack">
        <label for="input" class="input-label" id="input-label">Your message</label>
        <textarea id="input" rows="1" maxlength="4000" placeholder="Message Ciel or enter /command…" aria-describedby="input-help"></textarea>
      </div>
      <button class="send" id="send" type="submit" aria-label="Send message" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12 6-6 6 6m-6-6v13"/></svg></button>
    </form>
    <div class="toolbar">
      <div class="controls">
        <button class="control" id="mute" type="button" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3"/></svg><span id="mute-label">Mute mic</span></button>
        <button class="control" id="stop" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Stop reply</button>
      </div>
      <div class="secondary-controls">
        <button class="control secondary" id="help" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 8a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4m0 4h.01"/></svg>Help</button>
        <button class="control secondary" id="exit" type="button" disabled>Exit<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H5v14h4m4-11 4 4-4 4m-4-4h11"/></svg></button>
      </div>
    </div>
    <div class="keyboard-hint" id="input-help">Enter to send · Shift + Enter for a new line</div>
  </div>
</div>
<script>
'use strict';
const element = id => document.getElementById(id);
const runtime = {
  online: false, pending: false, polling: false, ended: false, initialized: false,
  activityTime: 0, baseline: 0, replyId: null, replyLive: false, dismissed: null, announced: null
};
const controls = ['core', 'mute', 'stop', 'exit', 'help', 'send'];
function text(node, value) { if (node.textContent !== value) node.textContent = value; }
function feedback(value, error = false) {
  text(element('notice'), value);
  element('notice').classList.toggle('error', error);
}
function syncControls() {
  element('input').disabled = runtime.ended;
  for (const id of controls) element(id).disabled = !runtime.online || runtime.pending;
  element('send').setAttribute('aria-busy', String(runtime.pending));
  element('composer').setAttribute('aria-busy', String(runtime.pending));
}
function hideSpeech() {
  text(element('reply-announcement'), '');
  runtime.dismissed = runtime.replyId;
  element('speech').hidden = true;
  element('speech-slot').classList.toggle('has-sources', false);
}
function safeSources(sources) {
  if (!Array.isArray(sources)) return [];
  const result = [], seen = new Set();
  for (const source of sources) {
    if (!source || typeof source.url !== 'string' || typeof source.title !== 'string') continue;
    if (!/^https?:\/\//i.test(source.url) || source.url.length > 2048
        || /^https?:\/\/[^/?#]*@/i.test(source.url)
        || /[\s\u0000-\u001f\u007f-\u009f\\]/.test(source.url)
        || /[\u0000-\u001f\u007f-\u009f]/.test(source.title)) continue;
    let url;
    try { url = new URL(source.url); } catch { continue; }
    if (!['http:', 'https:'].includes(url.protocol) || !url.hostname || url.username || url.password) continue;
    if (seen.has(source.url)) continue;
    seen.add(source.url);
    result.push({title: source.title.trim().slice(0, 300) || url.hostname, url: source.url});
    if (result.length === 20) break;
  }
  return result;
}
function showSources(sources) {
  const node = element('speech-sources'), safe = safeSources(sources);
  const key = JSON.stringify(safe);
  if (node.dataset.sources !== key) {
    while (node.firstElementChild) node.firstElementChild.remove();
    safe.forEach((source, index) => {
      const link = document.createElement('a');
      link.href = source.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.title = source.title;
      link.textContent = '[' + (index + 1) + '] ' + source.title;
      node.append(link);
    });
    node.dataset.sources = key;
  }
  node.hidden = safe.length === 0;
  element('speech-slot').classList.toggle('has-sources', safe.length > 0);
}
function showSpeech(reply) {
  if (runtime.replyId !== reply.id) text(element('reply-announcement'), '');
  if (runtime.dismissed === reply.id) return;
  runtime.replyId = reply.id;
  runtime.replyLive = Boolean(reply.live);
  element('speech').hidden = false;
  element('speech').classList.toggle('live', Boolean(reply.live));
  const node = element('speech-text');
  const following = node.scrollHeight - node.clientHeight - node.scrollTop < 40;
  text(node, reply.text);
  if (following) node.scrollTop = node.scrollHeight;
  text(element('speech-note'), reply.interrupted ? 'Reply stopped' : '');
  showSources(reply.sources);
  if (!reply.live && runtime.announced !== reply.id) {
    text(element('reply-announcement'), 'Ciel: ' + reply.text);
    runtime.announced = reply.id;
  }
}
function createOrb() {
  const canvas = element('orb-canvas'), core = element('core');
  const context = canvas.getContext('2d');
  if (!context) {
    core.classList.toggle('no-canvas', true);
    return {update() {}};
  }
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const tau = Math.PI * 2;
  const profiles = {
    offline: {speed: 0, energy: .08, glow: .3},
    idle: {speed: .18, energy: .14, glow: .75},
    listening_wake: {speed: .22, energy: .22, glow: .9},
    recording: {speed: .48, energy: .8, glow: 1},
    processing: {speed: .9, energy: .45, glow: .95},
    speaking: {speed: .55, energy: 1, glow: 1}
  };
  let state = 'offline', muted = false, frame = null, lastFrame = null;
  let time = 0, turn = .55, rippleAge = 2;
  let width = 0;
  let current = {...profiles.offline};
  const pointer = {x: 0, y: 0, targetX: 0, targetY: 0, hover: 0, targetHover: 0};
  const active = () => ['recording', 'processing', 'speaking'].includes(state);
  const target = () => muted && !active() ? profiles.offline : profiles[state] || profiles.idle;
  const moving = () => state !== 'offline' && (!muted || active())
    && !document.hidden && !reducedMotion.matches;
  const frameRate = () => state === 'speaking' ? 16 : active() ? 20 : 12;
  const mesh = [];
  // Cache the silhouette's trigonometry instead of recalculating it every frame.
  const silhouette = Array.from({length: 33}, (_, step) => {
    const angle = step / 32 * tau;
    return {
      x: Math.cos(angle), y: Math.sin(angle),
      sin3: Math.sin(angle * 3), cos3: Math.cos(angle * 3),
      sin7: Math.sin(angle * 7), cos7: Math.cos(angle * 7),
      sin11: Math.sin(angle * 11), cos11: Math.cos(angle * 11)
    };
  });
  function spherePoint(latitude, longitude) {
    const ring = Math.cos(latitude);
    return [ring * Math.cos(longitude), Math.sin(latitude), ring * Math.sin(longitude)];
  }
  for (let latitude = -3; latitude <= 3; latitude++) {
    const points = [];
    for (let step = 0; step <= 24; step++) {
      points.push(spherePoint(latitude * Math.PI / 8, step * Math.PI / 12));
    }
    mesh.push(points);
  }
  for (let longitude = 0; longitude < 10; longitude++) {
    const points = [];
    for (let step = 0; step <= 24; step++) {
      points.push(spherePoint(-Math.PI / 2 + step * Math.PI / 24, longitude * Math.PI / 5));
    }
    mesh.push(points);
  }
  function draw() {
    if (!width) return;
    context.clearRect(0, 0, width, width);
    // Procedural voice rhythms follow the assistant's state, without requiring browser mic access.
    const voice = state === 'speaking'
      ? .5 + .3 * Math.sin(time * 6.8) + .2 * Math.sin(time * 11.3)
      : state === 'recording' ? .5 + .25 * Math.sin(time * 4.2) : .2;
    const breath = Math.sin(time * 1.7) * .012;
    const center = width / 2, radius = width * .34 * (1 + breath + voice * current.energy * .035);
    const brightness = current.glow, energy = current.energy;
    const glow = context.createRadialGradient(center, center, radius * .25,
      center, center, radius * 1.4);
    glow.addColorStop(0, `rgba(103, 232, 249, ${(.035 + voice * .035) * brightness})`);
    glow.addColorStop(.65, `rgba(139, 92, 246, ${.09 * brightness})`);
    glow.addColorStop(1, 'rgba(139, 92, 246, 0)');
    context.fillStyle = glow;
    context.beginPath(); context.arc(center, center, radius * 1.4, 0, tau); context.fill();
    const sinTurn = Math.sin(turn + pointer.x * .25), cosTurn = Math.cos(turn + pointer.x * .25);
    const tilt = -.35 + Math.sin(time * .35) * .12 + pointer.y * .2;
    const sinTilt = Math.sin(tilt), cosTilt = Math.cos(tilt);
    function project(point, scale = .8, deform = true) {
      const wave = deform ? 1 + energy * (.025 * Math.sin(point[1] * 6 + time * 2.3)
        + .018 * Math.sin(point[0] * 8 - point[2] * 5 + time * 1.7)) : 1;
      const x = point[0] * cosTurn - point[2] * sinTurn;
      const depth = point[0] * sinTurn + point[2] * cosTurn;
      const y = point[1] * cosTilt - depth * sinTilt;
      const z = point[1] * sinTilt + depth * cosTilt;
      const size = radius * scale * wave * (1 + z * .12);
      return [center + x * size, center + y * size, z];
    }
    const projected = mesh.map(line => line.map(point => project(point)));
    const particles = [];
    for (let index = 0; index < 12; index++) {
      const angle = index * 2.39996 + time * (.1 + current.speed * .16);
      const latitude = Math.sin(index * 1.73 + time * .16) * .85;
      const point = project(spherePoint(latitude, angle), 1.14, false);
